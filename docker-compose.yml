services:
  agent:
    # Image công khai trên GitHub Container Registry (ghcr.io) — do GitHub Actions build.
    image: ghcr.io/connan94/lacvietnode-agent:v1.0.6
    container_name: LacVietNode-Agent
    labels:
      pi.ui.primary: "true"          # Pi Desktop/Pi Browser mở giao diện của service này
    ports:
      - "127.0.0.1:18761:8080"       # UI phục vụ nội bộ (Pi Browser truy cập qua SoloHost Remote)
    environment:
      - SERVER=app.lacviet-node.com
      - NODE_HOST=host.docker.internal
      - NODE_KEY=${NODE_KEY}         # khóa liên kết người dùng nhập ở form cài đặt (.env)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # để dò cổng node đã publish trên host (Linux)
    volumes:
      - ./data:/data                 # lưu khóa + bundle cập nhật (giữ qua các lần khởi động)
      # ⚠ BẢO MẬT: KHÔNG mount docker.sock trong bản phát hành cho người lạ.
      #   `:ro` KHÔNG làm Docker API chỉ-đọc — container vẫn tạo được container privileged -> chiếm host.
      #   App vẫn chạy tốt khi KHÔNG có nó (suy từ cổng nội bộ; ghi "không rõ" cho proto/đồng bộ).
      #   Chỉ bật nếu tin app + môi trường kín, tốt nhất qua docker-socket-proxy (read-only thật):
      - "../../docker_volumes:/nodecfg:ro"   # [v1.5] node cfg CHI-DOC: agent tu suy Public Key (seed chi trong RAM)
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
